spring.application.name=simply-study

server.port=${PORT:8080}
#
#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/study}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:project}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# POSTGRESQL / SUPABASE ROUTING DATA TARGETS
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.ubrvzubpveydpcwqvwsi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:?+-ymv!3M@.hkp8}

# HIKARI CONNECTION POOL SETTINGS (Optimized for Transaction Poolers)

# Enforces Hikari to disconnect safely before Supabase drops dead pool threads
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# JPA / HIBERNATE ENTERPRISE DATA MAPPING CONFIGURATIONS
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Operational tuning metrics for performance scaling
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Keep timezone as UTC globally for JVM/Jackson serialization
spring.jackson.time-zone=UTC

# DIAGNOSTIC ENGINE SYSTEM LOGGING LEVELS
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# SPRINGDOC OPENAPI / SWAGGER DOCUMENTATION HUD DASHBOARD
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tryItOutEnabled=true